name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint pipeline.sh
        run: shellcheck -s sh skills/sdd/scripts/pipeline.sh

  integration:
    name: Integration (${{ matrix.shell }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        shell: [bash, dash, zsh]
        exclude:
          - os: macos-latest
            shell: dash
    steps:
      - uses: actions/checkout@v4

      - name: Install shell (if needed)
        if: matrix.shell == 'dash' && runner.os == 'Linux'
        run: sudo apt-get install -y dash

      - name: Run integration tests
        shell: ${{ matrix.shell }} {0}
        run: |
          set -e
          P="skills/sdd/scripts/pipeline.sh"

          echo "=== Test: help ==="
          sh "$P" help

          echo "=== Test: version ==="
          sh "$P" version

          echo "=== Test: init ==="
          sh "$P" init test-feature

          echo "=== Test: status ==="
          sh "$P" status

          echo "=== Test: artifact ==="
          FDIR=".spec/features/test-feature"
          echo "test explore" > "$FDIR/explore.md"
          sh "$P" artifact

          echo "=== Test: status after artifact ==="
          sh "$P" status

          echo "=== Test: approve ==="
          sh "$P" approve

          echo "=== Test: status after approve ==="
          sh "$P" status

          echo "=== Test: artifact (requirements) ==="
          echo "test requirements" > "$FDIR/requirements.md"
          sh "$P" artifact

          echo "=== Test: approve (requirements) ==="
          sh "$P" approve

          echo "=== Test: artifact (design) ==="
          echo "test design" > "$FDIR/design.md"
          sh "$P" artifact

          echo "=== Test: approve (design) ==="
          sh "$P" approve

          echo "=== Test: artifact (impl) ==="
          echo "test task plan" > "$FDIR/task-plan.md"
          sh "$P" artifact

          echo "=== Test: approve (task-plan) ==="
          sh "$P" approve

          echo "=== Test: artifact (implementation) ==="
          echo "test implementation" > "$FDIR/implementation.md"
          sh "$P" artifact

          echo "=== Test: approve (implementation) ==="
          sh "$P" approve

          echo "=== Test: artifact (review) ==="
          echo "test review" > "$FDIR/review.md"
          sh "$P" artifact

          echo "=== Test: approve (review) ==="
          sh "$P" approve

          echo "=== Test: status (done) ==="
          sh "$P" status

          echo "=== Test: history ==="
          sh "$P" history

          echo "=== Test: path traversal rejected ==="
          sh "$P" init traversal-test
          if sh "$P" artifact "../../../etc/passwd" 2>/dev/null; then
            echo "FAIL: path traversal was not rejected"
            exit 1
          fi
          echo "PASS: path traversal correctly rejected"

          echo "=== Test: nonexistent file rejected ==="
          if sh "$P" artifact "nonexistent-file.md" 2>/dev/null; then
            echo "FAIL: nonexistent file was not rejected"
            exit 1
          fi
          echo "PASS: nonexistent file correctly rejected"

          echo "=== Test: JSON validity ==="
          sh "$P" init json-test
          JDIR=".spec/features/json-test"
          echo "test" > "$JDIR/explore.md"
          sh "$P" artifact
          python3 -c "import json; json.load(open('$JDIR/pipeline.json'))"
          echo "PASS: pipeline.json is valid JSON"

          echo "=== Test: duplicate feature rejected ==="
          if sh "$P" init test-feature 2>/dev/null; then
            echo "FAIL: duplicate feature was not rejected"
            exit 1
          fi
          echo "PASS: duplicate feature correctly rejected"

          echo "=== Test: config-check (valid) ==="
          mkdir -p .spec
          echo "context: test project" > .spec/config.yaml
          sh "$P" config-check
          echo "PASS: valid config accepted"

          echo "=== Test: config-check (invalid key) ==="
          echo "bogus_key: value" > .spec/config.yaml
          if sh "$P" config-check 2>/dev/null; then
            echo "FAIL: invalid config was not flagged"
            exit 1
          fi
          echo "PASS: invalid config correctly flagged"
          rm -f .spec/config.yaml

          echo "=== Test: abandon ==="
          sh "$P" init abandon-test
          sh "$P" abandon
          sh "$P" history | grep -q "abandon-test" || { echo "FAIL: abandon not in history"; exit 1; }
          echo "PASS: abandon works"

          echo "=== Test: inject ==="
          sh "$P" init inject-test
          echo "injected design content" > .spec/features/inject-test/design.md
          sh "$P" inject design .spec/features/inject-test/design.md
          sh "$P" status 2>&1 | grep -q "design" || { echo "FAIL: inject did not set phase"; exit 1; }
          echo "PASS: inject works"
          sh "$P" abandon

          echo "=== Test: task tracking ==="
          sh "$P" init task-test
          for phase in explore requirements design task-plan; do
            echo "test $phase" > ".spec/features/task-test/${phase}.md"
            sh "$P" artifact
            sh "$P" approve
          done
          sh "$P" task T-1
          sh "$P" status 2>&1 | grep -q "T-1" || { echo "FAIL: task not tracked"; exit 1; }
          echo "PASS: task tracking works"
          echo "test impl" > ".spec/features/task-test/implementation.md"
          sh "$P" artifact
          sh "$P" approve
          echo "test review" > ".spec/features/task-test/review.md"
          sh "$P" artifact
          sh "$P" approve

          echo "=== Test: docs-status (empty) ==="
          sh "$P" docs-status | grep -q '"exists": false' || { echo "FAIL: docs-status should report no queue"; exit 1; }
          echo "PASS: docs-status empty works"

          echo "=== Test: docs workflow ==="
          sh "$P" docs-init --all
          sh "$P" docs-status | grep -q '"exists": true' || { echo "FAIL: docs-init did not create queue"; exit 1; }
          echo "PASS: docs-init --all works"

          FIRST_TPL=$(sh "$P" docs-next | cut -f1)
          [ -n "$FIRST_TPL" ] || { echo "FAIL: docs-next returned empty"; exit 1; }
          echo "PASS: docs-next works ($FIRST_TPL)"

          sh "$P" docs-done "$FIRST_TPL"
          echo "PASS: docs-done works"

          sh "$P" docs-reset
          sh "$P" docs-status | grep -q '"exists": false' || { echo "FAIL: docs-reset did not clear queue"; exit 1; }
          echo "PASS: docs-reset works"

          echo "=== Test: parallel features ==="
          sh "$P" init parallel-a
          sh "$P" init parallel-b
          sh "$P" --feature parallel-a status 2>&1 | grep -q "parallel-a" || { echo "FAIL: --feature a"; exit 1; }
          sh "$P" --feature parallel-b status 2>&1 | grep -q "parallel-b" || { echo "FAIL: --feature b"; exit 1; }
          echo "PASS: parallel features work"
          sh "$P" --feature parallel-a abandon
          sh "$P" --feature parallel-b abandon

          echo "=== Test: finish keep ==="
          sh "$P" init finish-test
          for phase in explore requirements design task-plan implementation review; do
            echo "test $phase" > ".spec/features/finish-test/${phase}.md"
            sh "$P" artifact
            sh "$P" approve
          done
          sh "$P" --feature finish-test finish keep
          echo "PASS: finish keep works"

          sh "$P" --feature task-test revisions explore
          echo "PASS: revisions works"

          echo "=== All tests passed ==="
